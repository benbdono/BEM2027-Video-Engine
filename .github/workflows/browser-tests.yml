name: Browser media export tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  chromium-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual WebM export and segmented recording
        run: node tests/browser-export.mjs
